<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSIC — Premier Sound Experience</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sidebar / Navigation -->
  <aside class="sidebar">
    <div class="logo">MUSIC</div>
    <div class="nav-group">
      <h4>NAVIGATION</h4>
      <a href="#" id="nav-home" class="nav-link active">⌂ Accueil</a>
      <a href="/developers" class="nav-link">🔌 API Docs</a>
    </div>
  </aside>

  <!-- Contenu Principal -->
  <main class="main-content">

    <!-- Barre de Recherche Globale -->
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Rechercher un titre, artiste..." autocomplete="off">
    </div>

    <!-- 🏠 VUE 1 : PAGE D'ACCUEIL -->
    <section id="view-home" class="page-view">
      <div class="hero-banner">
        <h1>Découvrez les meilleures tendances</h1>
        <p>Écoutez et téléchargez vos morceaux préférés en haute qualité.</p>
      </div>
      <h2 class="section-title">🔥 Tendances du moment</h2>
      <div id="home-grid" class="tracks-grid"></div>
    </section>

    <!-- 🔎 VUE 2 : PAGE RÉSULTATS DE RECHERCHE -->
    <section id="view-search" class="page-view hidden">
      <div class="search-header">
        <button id="btn-back-home" class="btn btn-secondary">← Retour à l'accueil</button>
        <h2 id="search-query-title">Résultats pour "..."</h2>
      </div>
      <div id="search-grid" class="tracks-grid"></div>
    </section>

    <!-- 🎵 VUE 3 : PAGE DÉDIÉE / TITRE PRO -->
    <section id="view-track-details" class="page-view hidden">
      <button id="btn-back-results" class="btn btn-secondary" style="margin-bottom: 24px;">← Retour aux résultats</button>

      <div class="pro-track-container">
        <div class="pro-cover-wrapper">
          <img id="detail-cover" src="" alt="Cover" class="pro-cover">
        </div>
        
        <div class="pro-track-info">
          <span class="badge-pro">PREMIUM TRACK</span>
          <h1 id="detail-title">Titre du morceau</h1>
          <p id="detail-artist" class="artist-name">Artiste</p>
          <p id="detail-album" class="album-name">Album</p>

          <div class="pro-actions">
            <button id="btn-detail-play" class="btn btn-play btn-large">▶ Écouter maintenant</button>
            <button id="btn-detail-download" class="btn btn-download btn-large">⬇ Télécharger MP3</button>
            <button id="btn-detail-lyrics" class="btn btn-secondary btn-large">🎤 Paroles</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Player Persistant -->
  <div id="persistent-player" class="hidden">
    <div class="player-info">
      <img id="player-cover" class="player-cover" src="" alt="Cover">
      <div>
        <div id="player-title" class="track-title">Titre</div>
        <div id="player-artist" class="track-artist">Artiste</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button id="btn-play-toggle" class="btn-control">▶</button>
      </div>
      <input type="range" id="player-progress" class="progress-bar" value="0" min="0" max="100">
    </div>
  </div>

  <!-- Modal Lyrics -->
  <div id="lyrics-modal" class="modal">
    <div class="modal-content">
      <h3 id="lyrics-title">Paroles</h3>
      <p id="lyrics-body"></p>
      <button onclick="closeLyrics()" class="btn btn-secondary" style="margin-top: 20px; width: 100%;">Fermer</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
